name: Verify M-UI Fusion and build ARM64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and Linux ARM64 binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - name: Check web JavaScript syntax
        run: node --check web/mihomo-settings.js && node --check web/mihomo-rule-lists.js
      - name: Test balancer display labels
        run: node tests/balancer-labels.cjs
      - name: Test editable manual balancer defaults and source separation
        run: node tests/manual-balancer-defaults.cjs
      - name: Test friendly balancer dependency warning
        run: node tests/balancer-use-warning.cjs
      - name: Test Russian translation quality and CPU plurals
        run: node tests/russian-localization-quality.cjs
      - name: Test button hover colors and contrast across layout themes
        run: node tests/button-hover-colors.cjs
      - name: Test Mihomo editor Apply button and modal hover contrast
        run: node tests/mihomo-modal-primary.cjs
      - name: Test routing rule info icons and No-Resolve explanations
        run: node tests/routing-rule-tooltips.cjs
      - name: Guard saved outbound delay button and readable Save hover
        run: node tests/mihomo-delay-action.cjs
      - name: Verify isolated routing rule save with refreshed subscriptions
        run: node tests/mihomo-rules-only-save.cjs
      - name: Test Russian descriptions of all routing rule types
        run: node tests/routing-type-labels.cjs
      - name: Verify exact Mihomo toolbar buttons and legacy-browser hover fallback
        run: node tests/mihomo-toolbar-hover.cjs
      - name: Validate bilingual release notes and generic SSH guides
        run: node tests/release-notes-bilingual.cjs
      - name: Test stable login welcome and enlarged logo
        run: node tests/login-welcome.cjs
      - name: Test sidebar logo and header theme selector
        run: node tests/sidebar-theme.cjs
      - name: Verify transparent cat logo in favicon and panel
        run: node tests/transparent-cat-logo.cjs
      - name: Test Russian panel settings and admin credentials form
        run: node tests/panel-settings-ru.cjs
      - name: Test Mihomo Basics RU localization, login hover and peer errors
        run: node tests/mihomo-basics-russian.cjs
      - name: Test remaining color skins, contrast, persistence and migrations
        run: node tests/color-skins.cjs
      - name: Test balancer tab labels and locales
        run: node tests/balancer-tab-labels.cjs
      - name: Test Mihomo badges in named skins
        run: node tests/mihomo-skin-pills.cjs
      - name: Test routing list editor
        run: node tests/routing-lists.cjs
      - name: Test routing editor Russian labels
        run: node tests/routing-labels.cjs
      - name: Test basic and advanced routing editors
        run: node tests/routing-basic-editor.cjs
      - name: Test rule switches and priority drag persistence
        run: node tests/routing-rule-controls.cjs
      - name: Test localized built-in outbound names
        run: node tests/routing-outbound-labels.cjs
      - name: Run tests
        run: go test -count=1 ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Build native Sniffer ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w -X main.version=v1.0.0-ci' -o dist/m-ui-linux-arm64-fusion .
          sha256sum dist/m-ui-linux-arm64-fusion > dist/SHA256SUMS
      - name: Upload ARM64 test build
        uses: actions/upload-artifact@v4
        with:
          name: m-ui-linux-arm64-fusion
          path: |
            dist/m-ui-linux-arm64-fusion
            dist/SHA256SUMS
          retention-days: 14
