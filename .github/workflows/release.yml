name: Build and publish M-UI Fusion release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            echo "Expected a tag such as v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi

          echo "Release version: $GITHUB_REF_NAME"

      - name: Download Go modules
        run: go mod download

      - name: Validate web JavaScript
        run: node --check web/mihomo-settings.js && node --check web/mihomo-rule-lists.js

      - name: Test balancer display labels
        run: node tests/balancer-labels.cjs
      - name: Test editable manual balancer defaults and source separation
        run: node tests/manual-balancer-defaults.cjs
      - name: Test friendly balancer dependency warning
        run: node tests/balancer-use-warning.cjs
      - name: Validate bilingual release notes and generic SSH guides
        run: node tests/release-notes-bilingual.cjs
      - name: Test stable login welcome and enlarged logo
        run: node tests/login-welcome.cjs
      - name: Test sidebar logo and header theme selector
        run: node tests/sidebar-theme.cjs
      - name: Verify transparent cat logo in favicon and panel
        run: node tests/transparent-cat-logo.cjs
      - name: Test Russian panel settings and admin credentials form
        run: node tests/panel-settings-ru.cjs
      - name: Test Mihomo Basics RU localization, login hover and peer errors
        run: node tests/mihomo-basics-russian.cjs
      - name: Test remaining color skins, contrast, persistence and migrations
        run: node tests/color-skins.cjs
      - name: Test balancer tab labels and locales
        run: node tests/balancer-tab-labels.cjs
      - name: Test Mihomo badges in named skins
        run: node tests/mihomo-skin-pills.cjs
      - name: Test routing list editor
        run: node tests/routing-lists.cjs
      - name: Test routing editor Russian labels
        run: node tests/routing-labels.cjs
      - name: Test basic and advanced routing editors
        run: node tests/routing-basic-editor.cjs
      - name: Test localized built-in outbound names
        run: node tests/routing-outbound-labels.cjs
      - name: Run tests
        run: go test -count=1 ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          export GOOS=linux
          export CGO_ENABLED=0

          build_one() {
            local asset="$1"
            local goarch="$2"
            local goarm="${3:-}"
            local output="m-ui-linux-${asset}"
            local archive="${GITHUB_WORKSPACE}/dist/${output}.tar.gz"

            export GOARCH="$goarch"

            if [[ -n "$goarm" ]]; then
              export GOARM="$goarm"
            else
              unset GOARM || true
            fi

            echo "Building ${output}..."

            go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/${output}" \
              .

            chmod 0755 "dist/${output}"

            tar \
              -C "${GITHUB_WORKSPACE}/dist" \
              -czf "$archive" \
              "$output"
          }

          build_one "386"   "386"
          build_one "amd64" "amd64"
          build_one "arm64" "arm64"
          build_one "armv5" "arm" "5"
          build_one "armv6" "arm" "6"
          build_one "armv7" "arm" "7"
          build_one "s390x" "s390x"

          echo "Building m-ui-windows-amd64..."

          export GOOS=windows
          export GOARCH=amd64
          export CGO_ENABLED=0
          unset GOARM || true

          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/m-ui.exe" \
            .

          (
            cd dist
            zip -9 "m-ui-windows-amd64.zip" "m-ui.exe"
          )

          rm "dist/m-ui.exe"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            "m-ui-linux-386"
            "m-ui-linux-amd64"
            "m-ui-linux-arm64"
            "m-ui-linux-armv5"
            "m-ui-linux-armv6"
            "m-ui-linux-armv7"
            "m-ui-linux-s390x"
          )

          for asset in "${assets[@]}"; do
            archive="dist/${asset}.tar.gz"

            if [[ ! -s "$archive" ]]; then
              echo "Missing or empty archive: $archive"
              exit 1
            fi

            contents="$(tar -tzf "$archive")"

            if [[ "$contents" != "$asset" ]]; then
              echo "Unexpected contents in $archive:"
              echo "$contents"
              exit 1
            fi
          done

          windows_archive="dist/m-ui-windows-amd64.zip"

          if [[ ! -s "$windows_archive" ]]; then
            echo "Missing or empty archive: $windows_archive"
            exit 1
          fi

          windows_contents="$(unzip -Z1 "$windows_archive")"

          if [[ "$windows_contents" != "m-ui.exe" ]]; then
            echo "Unexpected contents in $windows_archive:"
            echo "$windows_contents"
            exit 1
          fi

          unzip -tq "$windows_archive"

          reported_version="$(./dist/m-ui-linux-amd64 version)"

          if [[ "$reported_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Incorrect embedded version."
            echo "Expected: $GITHUB_REF_NAME"
            echo "Actual:   $reported_version"
            exit 1
          fi

          echo "Embedded version: $reported_version"
          echo
          (cd dist && sha256sum m-ui-linux-*.tar.gz m-ui-windows-amd64.zip > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_files=(
            dist/m-ui-linux-*.tar.gz
            dist/m-ui-windows-amd64.zip
            dist/SHA256SUMS
          )

          # Keep the v1.0.0 historical notes; later tags get dedicated notes.
          release_notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$release_notes" ]]; then
            release_notes="docs/RELEASE-NOTES.md"
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; replacing its release assets."

            gh release upload \
              "$GITHUB_REF_NAME" \
              "${release_files[@]}" \
              --clobber
          else
            release_options=(
              --verify-tag
              --notes-file "$release_notes"
              --title "M-UI Fusion $(echo "$GITHUB_REF_NAME" | sed s/^v//)"
              --latest
            )

            gh release create \
              "$GITHUB_REF_NAME" \
              "${release_files[@]}" \
              "${release_options[@]}"
          fi

      - name: Retire pre-1.0 GitHub Releases and tags
        if: github.ref_name == 'v1.0.0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.0 >/dev/null
          echo 'First official release verified: v1.0.0'
          # An empty legacy list is the desired state. Do not fail under pipefail.
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            { grep -E '^v0[.]3[.]3-(fusion|sniffer)[.][0-9]+$' || true; } |
            while IFS= read -r tag; do
              echo "Deleting obsolete GitHub Release and tag: $tag"
              gh release delete "$tag" --cleanup-tag --yes
            done
          remaining="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          if [[ "$remaining" != "v1.0.0" ]]; then
            echo "Unexpected release inventory after cleanup: $remaining"
            exit 1
          fi
          echo "GitHub Releases cleanup verified: only v1.0.0 remains"

  docker:
    name: Publish Docker image
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/xenofan-git/m-ui-fusion
            ghcr.io/xenofan-git/m-ui-sniffer
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MUI_VERSION=${{ github.ref_name }}
            MIHOMO_VERSION=1.19.34
            MIHOMO_SHA256=2763f5b414527f7baf6dc57e3f82f3ab561eedf34bfd7c2f2cde1f7e592efe06
          cache-from: type=gha
          cache-to: type=gha,mode=max
